<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입사 전 업무환경 준비 체크리스트 (서울2)</title>
<style>
  @font-face { font-family: 'Pretendard'; src: local('Pretendard'); }

  :root {
    --orange: #FF6A1A;
    --ink: #1A1A1A;
    --gray: #8A8A8A;
    --gray-light: #B7B7B7;
    --line: #E4E4E4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #F3F3F1;
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .sheet {
    max-width: 1000px;
    margin: 0 auto;
    background: #fff;
    min-height: 100vh;
  }

  .topbar { height: 8px; background: var(--orange); }

  .toolbar-wrap {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    padding: 10px 24px 0;
  }
  .toolbar-buttons { display: flex; gap: 6px; }
  .tool-btn {
    background: #fff;
    border: 1px solid var(--line);
    color: var(--gray);
    font-size: 11px;
    padding: 6px 12px;
    border-radius: 7px;
    cursor: pointer;
    font-family: inherit;
  }
  .tool-btn:hover { color: var(--ink); border-color: var(--orange); }

  .save-toast {
    font-size: 11px;
    color: var(--orange);
    opacity: 0;
    transition: opacity 0.3s;
    height: 14px;
  }
  .save-toast.show { opacity: 1; }

  .header { padding: 22px 32px 16px; position: relative; }

  .corner-label {
    position: absolute;
    top: 24px;
    right: 32px;
    font-size: 10.5px;
    color: var(--gray-light);
  }

  h1 {
    font-size: 25px;
    font-weight: 800;
    margin: 0 0 10px;
    letter-spacing: -0.3px;
  }

  .subtitle { font-size: 12.5px; color: var(--gray); line-height: 1.6; }
  .subtitle .tag { color: var(--orange); font-weight: 800; }
  .subtitle .sep { color: var(--gray-light); margin: 0 6px; }

  .hr { height: 1px; background: var(--line); margin: 16px 32px 0; }

  .table-wrap { padding: 18px 32px 8px; overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; min-width: 640px; }

  thead th {
    text-align: left;
    font-size: 11px;
    color: var(--gray-light);
    font-weight: 700;
    padding: 0 10px 10px;
    border-bottom: 1px solid var(--line);
  }
  th.col-check { width: 44px; }
  th.col-team { width: 110px; }
  th.col-when { width: 100px; }

  tbody tr { border-bottom: 1px solid var(--line); }
  tbody tr.done .item-title { text-decoration: line-through; color: var(--gray-light); }
  tbody tr.done .item-desc { color: var(--gray-light); }

  td { padding: 14px 10px; vertical-align: top; }

  .checkbox {
    width: 17px;
    height: 17px;
    border: 1.5px solid var(--orange);
    border-radius: 3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 900;
    color: var(--orange);
    user-select: none;
  }

  .item-title { font-size: 13.5px; font-weight: 700; }

  .item-desc {
    font-size: 11.5px;
    color: var(--gray);
    line-height: 1.55;
    white-space: pre-wrap;
    max-width: 340px;
  }

  .team { font-size: 12px; font-weight: 700; color: var(--orange); }

  .when { font-size: 12px; color: var(--gray); white-space: nowrap; }

  .footer { padding: 16px 32px 26px; border-top: 1px solid var(--line); }

  .contact-row { display: flex; flex-wrap: wrap; gap: 24px; align-items: baseline; margin-bottom: 12px; }
  .contact-label { font-size: 12.5px; font-weight: 800; }
  .contact-item { font-size: 11.5px; color: var(--gray); display: flex; gap: 5px; align-items: baseline; }
  .contact-item b { color: var(--ink); font-weight: 700; }

  .footnote { font-size: 10px; color: var(--gray-light); line-height: 1.5; margin-top: 12px; }

  @media print {
    body { background: #fff; }
    .toolbar-wrap { display: none !important; }
    .sheet { max-width: none; }
  }

  @media (max-width: 700px) {
    .item-desc { max-width: none; }
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="topbar"></div>

  <div class="toolbar-wrap">
    <div class="toolbar-buttons">
      <button class="tool-btn" onclick="resetChecks()">체크 초기화</button>
      <button class="tool-btn" onclick="saveState()">저장</button>
      <button class="tool-btn" onclick="window.print()">인쇄 / PDF</button>
    </div>
    <span id="saveToast" class="save-toast"></span>
  </div>

  <div class="header">
    <div class="corner-label">우주사업부 HRBP · HR운영팀</div>
    <h1>입사 전 업무환경 준비 체크리스트 (서울2)</h1>
    <div class="subtitle">
      <span class="tag">부서원용</span><span class="sep">|</span>신규입사자가 빠르게 정착할 수 있도록 아래 항목들을 미리 확인해 주세요.
    </div>
  </div>

  <div class="hr"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="col-check">확인</th>
          <th>항목</th>
          <th>내용</th>
          <th class="col-team">유관부서</th>
          <th class="col-when">시점</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div class="footer">
    <div class="contact-row" id="contacts"></div>
    <div class="footnote">확인이 어렵거나 이상이 있으면 각 담당자에게 문의해 주세요.</div>
  </div>
</div>

<script>
const rowsData = [
  { title:"PC 및 IP신청", desc:"클레버스 전자결재 작성 및 상신\n[IT서비스] [본사] PC 및 인터넷·소프트웨어 신청서\n[보안] IP신청서", team:"운영혁신팀", when:"입사 D-7" },
  { title:"좌석·책상·의자", desc:"실물을 한번 더 확인하고, 누락이나 이상이 있을 시 지원팀 문의", team:"지원팀", when:"입사 D-1까지" },
  { title:"PC 수령", desc:"PC지원실에서 PC(노트북), 키보드, 마우스 수령", team:"보안팀", when:"입사 D-1까지" },
  { title:"모니터 네임텍", desc:"네임텍 양식은 지원팀으로부터 수령\n부서 비용으로 네임텍 구매 필요", team:"지원팀", when:"입사 D-1까지" },
  { title:"사원증 수령", desc:"신규입사자 사원증 수령 및 입사 당일에 전달\n서울 외 사업장은 등기 우편으로 발송되므로 등기 수령 여부 확인\n[미수령 시 인재확보팀 연락 필요]", team:"인재확보팀", when:"입사 D-1까지" },
  { title:"첫 출근 인솔", desc:"인재확보팀으로부터 신규입사자 연락처 사전 수령\n회신받은 출근 시간에 맞춰 마중", team:"인재확보팀", when:"입사 당일" },
];

const contactsData = [
  { label:"인재확보팀", who:"김지현 사원" },
  { label:"지원팀", who:"이민우 과장" },
  { label:"지원팀", who:"이은주 사원" },
  { label:"보안팀", who:"이경모 대리" },
  { label:"운영혁신팀", who:"이경수 대리" },
  { label:"HR운영팀", who:"윤수지 사원" },
];

const rowsEl = document.getElementById('rows');
const contactsEl = document.getElementById('contacts');
const STORAGE_KEY = 'hanwha_space_pre_checklist_seoul2_v1';

function renderRow(r, idx) {
  const tr = document.createElement('tr');
  tr.dataset.idx = idx;

  const tdCheck = document.createElement('td');
  const cb = document.createElement('div');
  cb.className = 'checkbox';
  cb.onclick = () => {
    tr.classList.toggle('done');
    cb.textContent = tr.classList.contains('done') ? '✓' : '';
  };
  tdCheck.appendChild(cb);

  const tdTitle = document.createElement('td');
  const title = document.createElement('div');
  title.className = 'item-title';
  title.textContent = r.title;
  tdTitle.appendChild(title);

  const tdDesc = document.createElement('td');
  const desc = document.createElement('div');
  desc.className = 'item-desc';
  desc.textContent = r.desc;
  tdDesc.appendChild(desc);

  const tdTeam = document.createElement('td');
  const team = document.createElement('div');
  team.className = 'team';
  team.textContent = r.team;
  tdTeam.appendChild(team);

  const tdWhen = document.createElement('td');
  const when = document.createElement('div');
  when.className = 'when';
  when.textContent = r.when;
  tdWhen.appendChild(when);

  tr.appendChild(tdCheck);
  tr.appendChild(tdTitle);
  tr.appendChild(tdDesc);
  tr.appendChild(tdTeam);
  tr.appendChild(tdWhen);

  rowsEl.appendChild(tr);
}

function renderContact(c) {
  const div = document.createElement('div');
  div.className = 'contact-item';
  const span = document.createElement('span');
  span.textContent = c.label;
  const b = document.createElement('b');
  b.textContent = c.who;
  div.appendChild(span);
  div.appendChild(b);
  contactsEl.appendChild(div);
}

function resetChecks() {
  document.querySelectorAll('tbody tr').forEach(tr => {
    tr.classList.remove('done');
    tr.querySelector('.checkbox').textContent = '';
  });
}

function showToast(msg) {
  const el = document.getElementById('saveToast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function saveState() {
  try {
    const done = Array.from(document.querySelectorAll('#rows tr')).map(tr => tr.classList.contains('done'));
    localStorage.setItem(STORAGE_KEY, JSON.stringify(done));
    showToast('저장되었습니다');
  } catch (e) {
    showToast('저장 실패');
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

rowsData.forEach(renderRow);
contactsData.forEach(renderContact);

const savedDone = loadState();
if (savedDone) {
  document.querySelectorAll('#rows tr').forEach((tr, i) => {
    if (savedDone[i]) {
      tr.classList.add('done');
      tr.querySelector('.checkbox').textContent = '✓';
    }
  });
}
</script>

</body>
</html>
